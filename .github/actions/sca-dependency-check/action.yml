name: SCA - OWASP Dependency Check
description: 'Runs OWASP Dependency Check for software composition analysis'

inputs:
  project-dir:
    description: 'Project directory'
    required: false
    default: 'via-backend'

runs:
  using: 'composite'
  steps:
    - name: Run OWASP Dependency Check
      shell: bash
      run: |
        cd ${{ inputs.project-dir }}
        echo "Starting OWASP Dependency-Check scan..."        
        
        MAVEN_CMD="mvn dependency-check:check -DdependencyCheck.skip=false -DconnectionTimeout=60000 -DreadTimeout=60000"
        if [ -n "${NVD_API_KEY}" ]; then
          echo "🔑 Using NVD API Key for authentication"
          MAVEN_CMD="$MAVEN_CMD -DnvdApiKey=${NVD_API_KEY}"
        else
          echo "⚠️ No NVD API Key found! Scan will likely fail with 403 in GitHub Actions."
        fi
        
        # Try to run the scan with retries for NVD API
        for attempt in 1 2 3; do
          echo "Attempt $attempt: Running dependency-check..."
          if eval $MAVEN_CMD; then
            echo "✅ Scan completed successfully"
            exit 0
          else
            if [ $attempt -lt 3 ]; then
              echo "⚠️  Scan failed on attempt $attempt, retrying in 10 seconds..."
              sleep 10
            fi
          fi
        done
        
        echo "⚠️  NVD Database update failed..."
        exit 0
      continue-on-error: true

    - name: Debug - Check generated files
      if: always()
      shell: bash
      run: |
        echo "=== Checking for Dependency Check output files ==="
        cd ${{ inputs.project-dir }}/target
        ls -lh . | grep -iE "dependency|report" || echo "No dependency-check files found yet"
        find . -name "*dependency*" -o -name "*check*" 2>/dev/null || echo "No files found in find"
        echo ""
        echo "=== Checking for HTML/XML reports ==="
        find . -maxdepth 1 \( -name "*.html" -o -name "*.xml" \) 2>/dev/null | grep -v spotbugs || echo "No SCA reports found"

    - name: Upload Dependency Check HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sca-dependency-check-html
        path: ${{ inputs.project-dir }}/target/dependency-check-report.html
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Dependency Check XML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sca-dependency-check-xml
        path: ${{ inputs.project-dir }}/target/dependency-check-report.xml
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Dependency Check JSON Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sca-dependency-check-json
        path: ${{ inputs.project-dir }}/target/dependency-check-report.json
        retention-days: 30
        if-no-files-found: warn